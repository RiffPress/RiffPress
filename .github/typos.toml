[default.extend-words]
# Intentional spellings go here, one per line, as `word = "word"`.
# HTMLMediaElement fires a `seeked` event; it is not a misspelling of "sought".
seeked = "seeked"
# The ID3v2 artist frame is TPE1, and the checker reads the digit separately.
TPE = "TPE"
# The company that runs Gravatar, named in the readme's external services.
Automattic = "Automattic"

[files]
extend-exclude = [
  # Generated by release-please; commit SHAs read as misspellings.
  "CHANGELOG.md",
  # Lockfiles and fixtures are not prose.
  "package-lock.json",
  "composer.lock",
  "packages/fixtures/",
  # Drawn covers: artwork whose long lines end in an ellipsis, not prose.
  "site/covers/",
  # WordPress's own function and hook names, spelled the way core spells them.
  "packages/wp-api-coverage/catalog/",
]
