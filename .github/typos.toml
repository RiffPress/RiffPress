[default.extend-words]
# Intentional spellings go here, one per line, as `word = "word"`.
# HTMLMediaElement fires a `seeked` event; it is not a misspelling of "sought".
seeked = "seeked"
# The ID3v2 artist frame is TPE1, and the checker reads the digit separately.
TPE = "TPE"
# The company that runs Gravatar, named in the readme's external services.
Automattic = "Automattic"
# Core's get_post_stati(), the plural it uses for post statuses.
stati = "stati"
# CBOR Object Signing and Encryption, the key format inside a WebAuthn attestation.
COSE = "COSE"
cose = "cose"
# The turntable maker, whose platter the drawn deck's measurements follow.
Technics = "Technics"
# A karaoke game that reads UltraStar's format, named in Riff Sing's readme.
Performous = "Performous"
# loc.gov's API asks for JSON with fo=json, its own name for the format.
fo = "fo"
# Creative Commons' NoDerivatives term, as in CC BY-NC-ND and its cc-by-nc-nd identifier.
ND = "ND"
nd = "nd"

[files]
extend-exclude = [
  # Generated by release-please; commit SHAs read as misspellings.
  "CHANGELOG.md",
  # Lockfiles and fixtures are not prose.
  "package-lock.json",
  "composer.lock",
  "packages/fixtures/",
  # Drawn covers: artwork whose long lines end in an ellipsis, not prose.
  "site/covers/",
  # WordPress's own function and hook names, spelled the way core spells them.
  "packages/wp-api-coverage/catalog/",
  # CHIMERA's build and its pronouncing dictionary, vendored as built (SOURCE.txt): minified code
  # whose short names read as misspellings, and a word list with every spelling in it.
  "plugins/riff-chimera/assets/chimera/",
]

[default]
# The ISO 639-2 to 639-1 map in class-media.php: three-letter codes, not misspelt words.
# A font's unicode-range: code points in hexadecimal, such as u+0100-02ba, not words.
extend-ignore-re = ["'[a-z]{3}' => '[a-z]{2}',", "(?i)u\\+[0-9a-f?]+(-[0-9a-f]+)?"]
