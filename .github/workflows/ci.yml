name: CI

on:
  push:
    branches: [ main ]
  # Unfiltered: `branches: [ main ]` would skip pull requests against another base.
  pull_request:
  # wp-env runs against current WordPress core, so a weekly run catches a core
  # release or a drifting dependency even when nothing has been pushed.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run it replaces. Pushes to main don't: every merged commit
# gets its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A required status check that every run reports, so the protected branch
  # always has something to read even when the paths filter skips the rest.
  gate:
    runs-on: ubuntu-24.04
    steps:
      - run: true

  # Docs-only changes skip the wp-env jobs. `workflow_call` jobs cannot carry
  # `paths:` themselves, so the filter runs as its own job and gates the rest.
  changes:
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code || steps.everything.outputs.code }}
    steps:
      # A scheduled or manual run has no diff to filter; run the whole suite.
      - id: everything
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: echo "code=true" >> "$GITHUB_OUTPUT"
      # Full history so the filter can diff against the previous push without
      # fetching, which it cannot do once the checkout drops its credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.everything.outcome == 'skipped'
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: steps.everything.outcome == 'skipped'
        id: filter
        with:
          filters: |
            code:
              - '**.php'
              - '**.js'
              - '**.css'
              - '**.json'
              - 'plugins/**'
              - 'packages/**'
              - 'site/**'
              - '.distignore'
              - 'phpcs.xml.dist'
              - 'phpunit.xml.dist'
              - '.github/workflows/**'

  phpcs:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/phpcs.yml

  phpunit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/phpunit.yml

  # The Playwright suite runs here on pull requests, pushes to main, and the weekly run, and locally from
  # the pre-commit hook.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/e2e.yml

  # What the plugin directory runs on submission, against the built zip, on every change to the code.
  plugin-check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/plugin-check.yml

  lint-js:
    needs: gate
    uses: ./.github/workflows/lint-js.yml

  # The generated references must match the code: docs/hooks.md, docs/javascript.md and site/web/
  # are current, and every hook and window.riff member has a docblock, an @since and its @params. Node only, so it runs on every change.
  docs:
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The hooks reference is current
        run: node .github/scripts/hooks-reference.js --check
      - name: The JavaScript reference is current
        run: node .github/scripts/js-reference.js --check
      - name: The PHP, REST and CSS references are documented
        run: node .github/scripts/reference-pages.js --check
      - name: The web pages are current
        run: node .github/scripts/web-pages.js --check
      - name: Each readme.txt changelog matches its CHANGELOG.md
        run: node .github/scripts/readme-changelog.js --check

  # packages/wp-api-coverage: its unit tests, then Riff's own report in the run summary. Node only,
  # so it runs on every change.
  api-coverage:
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests
        run: node --test packages/wp-api-coverage/test/*.test.js
      - name: Riff's WordPress API coverage
        run: |
          node packages/wp-api-coverage/bin/wp-api-coverage.js plugins/riff > api-coverage.txt
          cat api-coverage.txt
          { echo '```'; cat api-coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # packages/desktop: the address handling and the updater's choices. Node only, so it runs on every
  # change; the app itself is driven in e2e.yml.
  desktop:
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests
        run: node --test packages/desktop/test/*.test.js

  # Spell-checks docs too, so it stays outside the code gate.
  typos:
    needs: gate
    uses: ./.github/workflows/typos.yml

  # The one context main requires. A skipped reusable-workflow job reports
  # under its short name, so requiring "phpcs / WordPress Coding Standards"
  # directly would leave a docs-only pull request blocked forever. This job
  # runs unless the whole run was cancelled, passes when every job above
  # succeeded or was skipped, and fails otherwise. A job that timed out still
  # counts as a failure.
  status:
    name: CI status
    needs: [gate, changes, phpcs, phpunit, lint-js, typos, docs, api-coverage, desktop, e2e, plugin-check]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' <<< "$RESULTS"
          jq -e '[.[] | .result] | all(. == "success" or . == "skipped")' <<< "$RESULTS" > /dev/null
