name: Demo

# The permanent demo at demo.riffpress.com, on WP Engine: the plugin built from the release, the album,
# the seed and a reset script deployed over the SSH gateway, then the site reset to the seed. Runs on
# every published release, every night (the reset, so a day's visitors leave no trace), and by hand.
#
# Needs the WPE_SSHG_KEY_PRIVATE repository secret (the private half of the key added under SSH Keys
# in the WP Engine portal) and the WPE_ENV repository variable (the environment's name).

on:
  release:
    types: [published]
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: demo
      url: https://demo.riffpress.com/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the deploy is configured
        env:
          KEY: ${{ secrets.WPE_SSHG_KEY_PRIVATE }}
          ENV_NAME: ${{ vars.WPE_ENV }}
        run: |
          if [ -z "$KEY" ] || [ -z "$ENV_NAME" ]; then
            echo "::error::Set the WPE_SSHG_KEY_PRIVATE secret and the WPE_ENV variable."
            exit 1
          fi
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
      - name: Build the plugin and the demo set
        run: |
          set -euo pipefail
          mkdir -p build/plugin/riff build/demo/compositions
          rsync -a --exclude-from='.distignore' ./plugins/riff/ build/plugin/riff/
          find build/plugin/riff -name '*.php' -print0 | xargs -0 -n1 -P 4 php -l > /dev/null
          cp packages/fixtures/seed.php packages/fixtures/demo-reset.php packages/fixtures/demo-reset.sh build/demo/
          cp site/brand/mark.png build/demo/
          find packages/fixtures/compositions -maxdepth 1 -type f ! -name 'cover-*' -exec cp {} build/demo/compositions/ \;
          php -l build/demo/demo-reset.php > /dev/null
          du -sh build/plugin build/demo
      # The plugin folder is replaced whole; nothing else under wp-content is touched.
      - name: Deploy the plugin
        uses: wpengine/github-action-wpe-site-deploy@7bdbfb62eb657ae92afb91cb889d9c3fb36ef6c0 # v3.2.9
        with:
          WPE_SSHG_KEY_PRIVATE: ${{ secrets.WPE_SSHG_KEY_PRIVATE }}
          WPE_ENV: ${{ vars.WPE_ENV }}
          SRC_PATH: build/plugin/riff/
          REMOTE_PATH: wp-content/plugins/riff/
          FLAGS: -azvr --inplace --delete --exclude='.*'
      # The demo set lives beside the plugins, outside the web root's public paths, and the reset runs after.
      - name: Deploy the demo set and reset the site
        uses: wpengine/github-action-wpe-site-deploy@7bdbfb62eb657ae92afb91cb889d9c3fb36ef6c0 # v3.2.9
        with:
          WPE_SSHG_KEY_PRIVATE: ${{ secrets.WPE_SSHG_KEY_PRIVATE }}
          WPE_ENV: ${{ vars.WPE_ENV }}
          SRC_PATH: build/demo/
          REMOTE_PATH: wp-content/riff-demo/
          FLAGS: -azvr --inplace --delete --exclude='.*'
          SCRIPT: packages/fixtures/demo-reset.sh
          CACHE_CLEAR: 'TRUE'
      - name: Check the demo answers
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://demo.riffpress.com/ || true)
            [ "$code" = "200" ] && break
            sleep 10
          done
          echo "demo.riffpress.com -> $code"
          [ "$code" = "200" ]
          curl -s --max-time 20 https://demo.riffpress.com/ | grep -q 'riff-app' || { echo "::error::The Listen block is not on the front page"; exit 1; }
