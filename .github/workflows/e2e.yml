name: E2E

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A quarter of the suite on each of four runners, each with its own wp-env, so the specs never
  # share a site. Every runner pays the setup (about two and a half minutes) to run its quarter.
  e2e:
    name: Playwright (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          coverage: none
          tools: composer
      # The plugin autoloads vendor/ for Web Push, so the site under test needs
      # the runtime dependencies even though no PHP tooling runs here.
      - run: composer install --no-dev --no-interaction --prefer-dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-
      # The apt packages are not covered by the cache above, so install-deps
      # runs unconditionally while the browser download is skipped on a hit.
      # WebKit runs the tests tagged @smoke (see playwright.config.js).
      # apt waits on a stalled mirror indefinitely by default; a stalled download now gives up after
      # 30 seconds and is tried again, up to three times.
      - run: printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-retries
      # A stalled apt mirror once held this install for the job's full timeout.
      - run: npx playwright install-deps chromium webkit
        timeout-minutes: 20
      - run: npx playwright install chromium webkit
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}

      # Started here rather than by Playwright's webServer so a boot failure
      # lands in its own step instead of inside the test output.
      - run: npm run env:start
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/4

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-artifacts-${{ matrix.shard }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: WordPress debug log
        if: ${{ failure() }}
        run: npx wp-env run tests-cli -- cat wp-content/debug.log || true
