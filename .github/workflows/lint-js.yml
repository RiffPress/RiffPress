name: JavaScript and CSS Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint-js:
    name: ESLint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint:js
      # packages/types: the generated declarations, the client and the email example compile, refuse
      # what the routes and hooks refuse, and pass their tests.
      - run: npm run test:types
      # The site's animated pieces build; Pages builds them again to deploy.
      - run: npm run site:js

  # WordPress's stylelint config, over the plugin's and the site's CSS, as the pre-commit hook runs it.
  lint-css:
    name: Stylelint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint:css
