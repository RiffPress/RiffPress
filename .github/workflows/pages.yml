name: Pages

# Publishes Riff's two documentation sites to Cloudflare Pages, each to a project of its own:
#
#   source.riffpress.com     getting Riff and running it: Download, Add music, the Use, Run and
#                            Contribute doors, Built on the open web, How Riff is built,
#                            Accessibility, and everything the live demo needs: riff.zip built from
#                            main, blueprint.json, the seed script and the demo audio, all with URLs
#                            stamped by commit so caches never serve an old build. Project
#                            riffpress-developer, which served both hosts before the split and keeps
#                            the public face where it was.
#   developer.riffpress.com  building on Riff: the reference and the guides to extending it. Project
#                            build-on-riff.
#
# blueprint.json names the demo's files relative to itself; this workflow resolves them against
# Source. riffpress.com is the business's own site, from its own repository, which carries the
# redirects from the addresses this one used to serve there. GitHub Pages keeps serving a one-line
# redirect at the old address, so links to it still land.
#
# site/ keeps the docs under /developers/, and developers-site.js puts each page on its host, at the
# host's root, writes each host's _redirects for the addresses the other used to serve, and fails
# the deploy on a link on either that leads nowhere. What it leaves behind is not deployed.
#
# Pages' _redirects can't tell hosts apart, so Source's redirects to developer.riffpress.com would
# send that host to itself while it is still a custom domain of Source's project. The developer
# site is deployed first, and Source only once developer.riffpress.com answers with the developer
# build (its X-Riff-Site header says which build a host serves).
#
# Needs two repository secrets, CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit) and CLOUDFLARE_ACCOUNT_ID,
# and takes the addresses from the SITE_URL, SOURCE_URL and DEVELOPER_URL repository variables when
# set. Each custom domain is attached to its project in the Cloudflare dashboard, which writes the DNS
# record itself. Runs on every push to main; the weekly run catches commits that do not start push
# workflows.

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '23 9 * * 1'

permissions: {}

# Deploys queue rather than cancel each other: the first album build runs long, and a push to main
# in the meantime would otherwise cut it off before its cache is saved.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  SOURCE_PROJECT: riffpress-developer
  DEVELOPER_PROJECT: build-on-riff
  SITE_URL: ${{ vars.SITE_URL || 'https://riffpress.com/' }}
  SOURCE_URL: ${{ vars.SOURCE_URL || 'https://source.riffpress.com/' }}
  DEVELOPER_URL: ${{ vars.DEVELOPER_URL || 'https://developer.riffpress.com/' }}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    # The first build of the streamed albums downloads and encodes ninety-odd tracks; later runs find
    # them in the cache, which a cancelled job never saves.
    timeout-minutes: 90
    permissions:
      contents: read
    environment:
      name: cloudflare-pages
      url: ${{ env.SOURCE_URL }}
    outputs:
      base: ${{ steps.site.outputs.base }}
      source: ${{ steps.site.outputs.source }}
      developer: ${{ steps.site.outputs.developer }}
      version: ${{ steps.site.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Build the streamed albums
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: albums
        with:
          path: ~/.cache/riff-albums
          key: albums-${{ hashFiles('packages/fixtures/*/source.json', 'packages/fixtures/album.js') }}
      - if: steps.albums.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq ffmpeg > /dev/null
          for m in packages/fixtures/*/manifest.json; do
            slug=$(basename "$(dirname "$m")")
            node -e "process.exit(require('./$m').remote ? 0 : 1)" || continue
            RIFF_JAZZ_CACHE=~/.cache/riff-albums/src node packages/fixtures/album.js "$slug" --out ~/.cache/riff-albums/built/"$slug"
          done
          git checkout -- packages/fixtures
      - name: Build riff.zip
        run: |
          set -euo pipefail
          bash .github/scripts/build-riff.sh
          (cd build && zip -qr riff.zip riff/)
          test -f build/riff/riff.php
          find build/riff -name '*.php' -print0 | xargs -0 -n1 -P 4 php -l > /dev/null
      - name: Build the site's scripts
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run site:js
      - name: Assemble the site
        id: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out/demo
          # The reference pages quote line numbers, so they are built from this commit, not committed.
          node .github/scripts/hooks-reference.js
          node .github/scripts/js-reference.js
          node .github/scripts/reference-pages.js
          node .github/scripts/handbook-pages.js
          node .github/scripts/web-pages.js
          cp -R site/. out/
          # No lone last word on a line: each block's last two words joined by a no-break space.
          node .github/scripts/no-widows.js out
          cp build/riff.zip out/
          # Riff Chords and Riff Sing, which the blueprint installs beside Riff for the charted song.
          bash .github/scripts/build-demo-plugins.sh out/demo
          cp packages/fixtures/seed.php out/demo/
          find packages/fixtures/compositions -maxdepth 1 -type f ! -name 'cover-*' -exec cp {} out/demo/ \;
          cp site/brand/mark.png out/demo/
          # The streamed albums: audio under demo/<slug>/, every album's manifest and levels in one
          # albums.json beside the seed, and base.txt, where the seed finds the audio.
          for m in packages/fixtures/*/manifest.json; do
            slug=$(basename "$(dirname "$m")")
            node -e "process.exit(require('./$m').remote ? 0 : 1)" || continue
            mkdir -p "out/demo/$slug"
            cp ~/.cache/riff-albums/built/"$slug"/*.mp3 "out/demo/$slug/"
          done
          node .github/scripts/demo-albums.js bundle packages/fixtures out/demo/albums.json
          printf '%sdemo/' "$(printf '%s' "$SOURCE_URL" | sed -E 's#^http://#https://#; s#/*$#/#')" > out/demo/base.txt
          du -sh out/demo
          # Playground runs on https and a browser will not fetch http from it, so the scheme is always https.
          BASE=$(printf '%s' "$SITE_URL" | sed -E 's#^http://#https://#; s#/*$#/#')
          [[ "$BASE" =~ ^https://[^/]+/ ]] || { echo "::error::Unexpected site URL: $BASE"; exit 1; }
          # Stamp every asset URL with the commit so a deploy is always a new URL: the pages' stylesheets,
          # and the blueprint's zip and demo files (pull requests' Playground previews still use it).
          V="${GITHUB_SHA::7}"
          sed -i -E "s#\{\{pages_url\}\}#${BASE}#g" out/robots.txt out/sitemap.xml
          # The 404 is served at whatever address was missed, so its links are absolute.
          sed -i -E "s#\{\{pages_url\}\}#${BASE}#g; s#(href=\"[^\"?]+\.css)\"#\1?v=${V}\"#g" out/404.html out/404-developer.html
          VERSION=$(sed -nE 's/^ \* Version: *([0-9][0-9A-Za-z.-]*).*$/\1/p' plugins/riff/riff.php | head -n1)
          [[ -n "$VERSION" ]] || { echo "::error::No version in riff.php"; exit 1; }
          # The newest release that is not a pre-release: what releases/latest serves. While Riff is ahead of
          # WordPress (5.0.0 needs 7.2, in beta until 8 December 2026) the 7.2-only releases are flagged
          # pre-release, so this is the last one for 7.0 and 7.1, and the Download page offers both. The
          # line goes once the two agree.
          # Asked with the workflow's token: unsigned, the API rate-limits a shared runner and answers 403. A
          # failed lookup leaves STABLE empty, and the line below falls back to this build's version.
          STABLE=$( { curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" || true; } | sed -nE 's/^ *"tag_name": *"(riff-)?v?([^"]+)".*$/\2/p' | head -n1)
          [[ -n "$STABLE" ]] || STABLE="$VERSION"
          if [[ "$STABLE" == "$VERSION" ]]; then sed -i -E '/class="fine stable"/d' out/download/index.html; fi
          sed -i -E "s#\{\{stable\}\}#${STABLE}#g" out/download/index.html
          find out/web out/add-music out/download out/developers out/built out/accessibility -name index.html -exec sed -i -E "s#\{\{pages_url\}\}#${BASE}#g; s#\{\{commit\}\}#${GITHUB_SHA}#g; s#\{\{version\}\}#${VERSION}#g; s#(href=\"[^\"?]+\.css)\"#\1?v=${V}\"#g" {} +
          if grep -rn '{{' out/404.html out/404-developer.html out/robots.txt out/sitemap.xml out/web out/add-music out/download out/developers out/built out/accessibility; then echo "::error::A placeholder survived"; exit 1; fi
          # The two sites, each page on its host.
          SRC=$(printf '%s' "$SOURCE_URL" | sed -E 's#^http://#https://#; s#/*$#/#')
          DEV=$(printf '%s' "$DEVELOPER_URL" | sed -E 's#^http://#https://#; s#/*$#/#')
          [[ "$SRC" =~ ^https://[^/]+/$ ]] || { echo "::error::Unexpected Source URL: $SRC"; exit 1; }
          [[ "$DEV" =~ ^https://[^/]+/$ ]] || { echo "::error::Unexpected developer URL: $DEV"; exit 1; }
          node .github/scripts/developers-site.js out out-source out-developer "$BASE" "$SRC" "$DEV"
          if grep -rln '{{' out-developer --include='*.html'; then echo "::error::A placeholder survived"; exit 1; fi
          # The demo, on Source, with its blueprint resolved against it.
          mkdir -p out-source/demo
          cp -R out/demo/. out-source/demo/
          cp out/riff.zip out-source/
          node .github/scripts/demo-blueprint.js resolve blueprint.json "$SRC" "$V" > out-source/blueprint.json
          grep -c "?v=${V}" out-source/blueprint.json
          # Everything stamped by commit can be cached forever; the blueprint is fetched fresh.
          cat >> out-source/_headers <<'HEADERS'
          /demo/*
            Cache-Control: public, max-age=31536000, immutable
          /riff.zip
            Cache-Control: public, max-age=31536000, immutable
          /blueprint.json
            Cache-Control: no-cache
          HEADERS
          ls -la out-source out-source/demo out-developer
          { echo "base=$BASE"; echo "source=$SRC"; echo "developer=$DEV"; echo "version=$V"; } >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SRC: ${{ steps.site.outputs.source }}
          DEV: ${{ steps.site.outputs.developer }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi
          # Which build a host serves, from the X-Riff-Site header developers-site.js gives each.
          site_of() {
            curl -fsS -o /dev/null -D - --retry 6 --retry-delay 10 --retry-all-errors "$1" | tr -d '\r' | sed -nE 's/^x-riff-site: *//Ip' | head -n1
          }
          # Creating a project fails harmlessly once it exists.
          npx --yes wrangler@4 pages project create "$DEVELOPER_PROJECT" --production-branch main 2> /dev/null || true
          npx --yes wrangler@4 pages project create "$SOURCE_PROJECT" --production-branch main 2> /dev/null || true
          # The developer site first: it sends nothing back to Source that Source doesn't serve.
          npx --yes wrangler@4 pages deploy out-developer --project-name "$DEVELOPER_PROJECT" --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true
          # Source's redirects send the reference to the developer host, which would loop while that host is
          # still one of Source's project's custom domains.
          serving="$(site_of "$DEV")"
          if [ "$serving" != developer ]; then
            move="In Cloudflare, remove ${DEV} from the $SOURCE_PROJECT project's custom domains and add it to $DEVELOPER_PROJECT's, then run this again."
            # Still one of Source's own domains, as it is until that move is made once: the developer
            # site is deployed and waits there, and Source is left as it was, so nothing loops. Source
            # says so by its header, or, deployed before it sent one, by sending the same page.
            page_of() {
              local body
              body="$(curl -fsS --retry 6 --retry-delay 10 --retry-all-errors "$1")" || return 1
              [ -n "$body" ] || return 1
              printf '%s' "$body" | sha256sum | cut -d' ' -f1
            }
            dev_page="$(page_of "$DEV" || echo "unreachable: $DEV")"
            src_page="$(page_of "$SRC" || echo "unreachable: $SRC")"
            if [ "$serving" = source ] || [ "$dev_page" = "$src_page" ]; then
              echo "::warning::The developer site is deployed but not yet at ${DEV}, which Source still serves. $move Source is left as it was."
              printf '### Source not deployed: waiting for the developer domain\n\nThe developer site is deployed to %s. %s Until then Source keeps its last deploy, since its redirects would send the reference back to itself.\n' "$DEVELOPER_PROJECT" "$move" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::${DEV} answers with neither the developer site nor Source (X-Riff-Site: '${serving}'). $move Source is left as it was."
            exit 1
          fi
          npx --yes wrangler@4 pages deploy out-source --project-name "$SOURCE_PROJECT" --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true
          for pair in "${SRC}download/=source" "${DEV}php/=developer"; do
            url="${pair%=*}"
            want="${pair##*=}"
            if [ "$(site_of "$url")" != "$want" ]; then
              echo "::error::$url does not answer with the $want site. Attach its host to the project that builds it as a custom domain, then run this again."
              exit 1
            fi
          done
      # The deploy reports success whether or not the demo can load what it names. Ask for each file the
      # way Playground will, from another origin, so a dead URL fails here instead of on a visitor.
      - name: Check every file the demo fetches
        env:
          BLUEPRINT: ${{ steps.site.outputs.source }}blueprint.json?v=${{ steps.site.outputs.version }}
        run: node .github/scripts/demo-blueprint.js check "$BLUEPRINT" 18

  # GitHub Pages keeps the old address alive as a redirect to the site.
  redirect:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: A page that sends the old address on
        env:
          BASE: ${{ needs.deploy.outputs.base }}
        run: |
          set -euo pipefail
          mkdir -p redirect
          cat > redirect/index.html <<HTML
          <!doctype html><html lang="en"><head><meta charset="utf-8"><title>Riff</title><meta http-equiv="refresh" content="0; url=${BASE}"><link rel="canonical" href="${BASE}"><meta name="robots" content="noindex"></head><body><p>Riff has moved to <a href="${BASE}">${BASE}</a>.</p></body></html>
          HTML
          cp redirect/index.html redirect/404.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: redirect
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
