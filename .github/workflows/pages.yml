name: Pages

# Publishes the developer site to Cloudflare Pages at source.riffpress.com: the reference, the
# pages about the software, and everything the live demo needs: riff.zip built from main,
# blueprint.json, the seed script and the demo audio, all with URLs stamped by commit so caches never
# serve an old build. blueprint.json names those files relative to itself; this workflow resolves
# them against the developer host. riffpress.com is the business's own site, from its own
# repository, which carries the redirects from the addresses this one used to serve there. GitHub
# Pages keeps serving a one-line redirect at the old address, so links to it still land.
#
# site/ keeps the reference under /developers/, and developers-site.js moves it to the host's root
# with the software's pages, and fails the deploy on a link that leads nowhere. What it leaves
# behind is not deployed.
#
# Needs two repository secrets, CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit) and CLOUDFLARE_ACCOUNT_ID,
# and takes the addresses from the SITE_URL and DEVELOPER_URL repository variables when set. Each
# custom domain is attached to its project in the Cloudflare dashboard, which writes the DNS record itself.
# Runs on every push to main; the weekly run catches commits that do not start push workflows.

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '23 9 * * 1'

permissions: {}

# Deploys queue rather than cancel each other: the first album build runs long, and a push to main
# in the meantime would otherwise cut it off before its cache is saved.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  DEVELOPER_PROJECT: riffpress-developer
  SITE_URL: ${{ vars.SITE_URL || 'https://riffpress.com/' }}
  DEVELOPER_URL: ${{ vars.DEVELOPER_URL || 'https://source.riffpress.com/' }}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    # The first build of the streamed albums downloads and encodes ninety-odd tracks; later runs find
    # them in the cache, which a cancelled job never saves.
    timeout-minutes: 90
    permissions:
      contents: read
    environment:
      name: cloudflare-pages
      url: ${{ env.DEVELOPER_URL }}
    outputs:
      base: ${{ steps.site.outputs.base }}
      developers: ${{ steps.site.outputs.developers }}
      version: ${{ steps.site.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Build the streamed albums
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: albums
        with:
          path: ~/.cache/riff-albums
          key: albums-${{ hashFiles('packages/fixtures/*/source.json', 'packages/fixtures/album.js') }}
      - if: steps.albums.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq ffmpeg > /dev/null
          for m in packages/fixtures/*/manifest.json; do
            slug=$(basename "$(dirname "$m")")
            node -e "process.exit(require('./$m').remote ? 0 : 1)" || continue
            RIFF_JAZZ_CACHE=~/.cache/riff-albums/src node packages/fixtures/album.js "$slug" --out ~/.cache/riff-albums/built/"$slug"
          done
          git checkout -- packages/fixtures
      - name: Build riff.zip
        run: |
          set -euo pipefail
          bash .github/scripts/build-riff.sh
          (cd build && zip -qr riff.zip riff/)
          test -f build/riff/riff.php
          find build/riff -name '*.php' -print0 | xargs -0 -n1 -P 4 php -l > /dev/null
      - name: Build the site's scripts
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run site:js
      - name: Assemble the site
        id: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out/demo
          # The reference pages quote line numbers, so they are built from this commit, not committed.
          node .github/scripts/hooks-reference.js
          node .github/scripts/js-reference.js
          node .github/scripts/reference-pages.js
          node .github/scripts/handbook-pages.js
          node .github/scripts/web-pages.js
          cp -R site/. out/
          # No lone last word on a line: each block's last two words joined by a no-break space.
          node .github/scripts/no-widows.js out
          cp build/riff.zip out/
          # Riff Chords and Riff Sing, which the blueprint installs beside Riff for the charted song.
          bash .github/scripts/build-demo-plugins.sh out/demo
          cp packages/fixtures/seed.php out/demo/
          find packages/fixtures/compositions -maxdepth 1 -type f ! -name 'cover-*' -exec cp {} out/demo/ \;
          cp site/brand/mark.png out/demo/
          # The streamed albums: audio under demo/<slug>/, every album's manifest and levels in one
          # albums.json beside the seed, and base.txt, where the seed finds the audio.
          for m in packages/fixtures/*/manifest.json; do
            slug=$(basename "$(dirname "$m")")
            node -e "process.exit(require('./$m').remote ? 0 : 1)" || continue
            mkdir -p "out/demo/$slug"
            cp ~/.cache/riff-albums/built/"$slug"/*.mp3 "out/demo/$slug/"
          done
          node .github/scripts/demo-albums.js bundle packages/fixtures out/demo/albums.json
          printf '%sdemo/' "$(printf '%s' "$DEVELOPER_URL" | sed -E 's#^http://#https://#; s#/*$#/#')" > out/demo/base.txt
          du -sh out/demo
          # Playground runs on https and a browser will not fetch http from it, so the scheme is always https.
          BASE=$(printf '%s' "$SITE_URL" | sed -E 's#^http://#https://#; s#/*$#/#')
          [[ "$BASE" =~ ^https://[^/]+/ ]] || { echo "::error::Unexpected site URL: $BASE"; exit 1; }
          # Stamp every asset URL with the commit so a deploy is always a new URL: the pages' stylesheets,
          # and the blueprint's zip and demo files (pull requests' Playground previews still use it).
          V="${GITHUB_SHA::7}"
          sed -i -E "s#\{\{pages_url\}\}#${BASE}#g" out/robots.txt out/sitemap.xml
          # The 404 is served at whatever address was missed, so its links are absolute.
          sed -i -E "s#\{\{pages_url\}\}#${BASE}#g; s#(href=\"[^\"?]+\.css)\"#\1?v=${V}\"#g" out/404.html
          VERSION=$(sed -nE 's/^ \* Version: *([0-9][0-9A-Za-z.-]*).*$/\1/p' plugins/riff/riff.php | head -n1)
          [[ -n "$VERSION" ]] || { echo "::error::No version in riff.php"; exit 1; }
          # The newest release that is not a pre-release: what releases/latest serves. While Riff is ahead of
          # WordPress (5.0.0 needs 7.2, in beta until 8 December 2026) the 7.2-only releases are flagged
          # pre-release, so this is the last one for 7.0 and 7.1, and the Download page offers both. The
          # line goes once the two agree.
          # Asked with the workflow's token: unsigned, the API rate-limits a shared runner and answers 403. A
          # failed lookup leaves STABLE empty, and the line below falls back to this build's version.
          STABLE=$( { curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" || true; } | sed -nE 's/^ *"tag_name": *"(riff-)?v?([^"]+)".*$/\2/p' | head -n1)
          [[ -n "$STABLE" ]] || STABLE="$VERSION"
          if [[ "$STABLE" == "$VERSION" ]]; then sed -i -E '/class="fine stable"/d' out/download/index.html; fi
          sed -i -E "s#\{\{stable\}\}#${STABLE}#g" out/download/index.html
          find out/web out/add-music out/download out/developers out/built out/accessibility -name index.html -exec sed -i -E "s#\{\{pages_url\}\}#${BASE}#g; s#\{\{commit\}\}#${GITHUB_SHA}#g; s#\{\{version\}\}#${VERSION}#g; s#(href=\"[^\"?]+\.css)\"#\1?v=${V}\"#g" {} +
          if grep -rn '{{' out/404.html out/robots.txt out/sitemap.xml out/web out/add-music out/download out/developers out/built out/accessibility; then echo "::error::A placeholder survived"; exit 1; fi
          # The developer site.
          DEV=$(printf '%s' "$DEVELOPER_URL" | sed -E 's#^http://#https://#; s#/*$#/#')
          [[ "$DEV" =~ ^https://[^/]+/$ ]] || { echo "::error::Unexpected developers URL: $DEV"; exit 1; }
          node .github/scripts/developers-site.js out out-developers "$BASE" "$DEV"
          # The demo, on the developer host, with its blueprint resolved against it.
          mkdir -p out-developers/demo
          cp -R out/demo/. out-developers/demo/
          cp out/riff.zip out-developers/
          node .github/scripts/demo-blueprint.js resolve blueprint.json "$DEV" "$V" > out-developers/blueprint.json
          grep -c "?v=${V}" out-developers/blueprint.json
          # Everything stamped by commit can be cached forever; the blueprint is fetched fresh.
          cat >> out-developers/_headers <<'HEADERS'
          /demo/*
            Cache-Control: public, max-age=31536000, immutable
          /riff.zip
            Cache-Control: public, max-age=31536000, immutable
          /blueprint.json
            Cache-Control: no-cache
          HEADERS
          ls -la out-developers out-developers/demo
          { echo "base=$BASE"; echo "developers=$DEV"; echo "version=$V"; } >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEVELOPERS: ${{ steps.site.outputs.developers }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi
          # Creating a project fails harmlessly once it exists.
          npx --yes wrangler@4 pages project create "$DEVELOPER_PROJECT" --production-branch main 2> /dev/null || true
          npx --yes wrangler@4 pages deploy out-developers --project-name "$DEVELOPER_PROJECT" --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true
          if ! curl -fsS -o /dev/null --retry 6 --retry-delay 10 --retry-all-errors "${DEVELOPERS}php/"; then
            echo "::error::${DEVELOPERS} does not answer. Attach it to the $DEVELOPER_PROJECT project as a custom domain, then run this again."
            exit 1
          fi
      # The deploy reports success whether or not the demo can load what it names. Ask for each file the
      # way Playground will, from another origin, so a dead URL fails here instead of on a visitor.
      - name: Check every file the demo fetches
        env:
          BLUEPRINT: ${{ steps.site.outputs.developers }}blueprint.json?v=${{ steps.site.outputs.version }}
        run: node .github/scripts/demo-blueprint.js check "$BLUEPRINT" 18

  # GitHub Pages keeps the old address alive as a redirect to the site.
  redirect:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: A page that sends the old address on
        env:
          BASE: ${{ needs.deploy.outputs.base }}
        run: |
          set -euo pipefail
          mkdir -p redirect
          cat > redirect/index.html <<HTML
          <!doctype html><html lang="en"><head><meta charset="utf-8"><title>Riff</title><meta http-equiv="refresh" content="0; url=${BASE}"><link rel="canonical" href="${BASE}"><meta name="robots" content="noindex"></head><body><p>Riff has moved to <a href="${BASE}">${BASE}</a>.</p></body></html>
          HTML
          cp redirect/index.html redirect/404.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: redirect
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
