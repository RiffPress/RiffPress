name: Pages

# Publishes the landing page to Cloudflare Pages at riffpress.com, and with it everything the live demo
# needs: riff.zip built from main, blueprint.json, the seed script and the demo audio, all with URLs stamped
# by commit so caches never serve an old build. blueprint.json names those files relative to itself; this
# workflow resolves them against the site's address. GitHub Pages keeps serving a one-line redirect at the
# old address, so links to it still land.
#
# Needs two repository secrets, CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit) and CLOUDFLARE_ACCOUNT_ID,
# and takes the address from the SITE_URL repository variable when set. The custom domain is attached
# to the project in the Cloudflare dashboard, which writes the DNS record itself.
# Runs on every push to main; the weekly run catches commits that do not start push workflows.

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '23 9 * * 1'

permissions: {}

# Deploys queue rather than cancel each other: the first album build runs long, and a push to main
# in the meantime would otherwise cut it off before its cache is saved.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  PROJECT: riffpress
  SITE_URL: ${{ vars.SITE_URL || 'https://riffpress.com/' }}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    # The first build of the streamed albums downloads and encodes ninety-odd tracks; later runs find
    # them in the cache, which a cancelled job never saves.
    timeout-minutes: 90
    permissions:
      contents: read
    environment:
      name: cloudflare-pages
      url: ${{ env.SITE_URL }}
    outputs:
      base: ${{ steps.site.outputs.base }}
      version: ${{ steps.site.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Build the streamed albums
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: albums
        with:
          path: ~/.cache/riff-albums
          key: albums-${{ hashFiles('packages/fixtures/*/source.json', 'packages/fixtures/album.js') }}
      - if: steps.albums.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq ffmpeg > /dev/null
          for m in packages/fixtures/*/manifest.json; do
            slug=$(basename "$(dirname "$m")")
            node -e "process.exit(require('./$m').remote ? 0 : 1)" || continue
            RIFF_JAZZ_CACHE=~/.cache/riff-albums/src node packages/fixtures/album.js "$slug" --out ~/.cache/riff-albums/built/"$slug"
          done
          git checkout -- packages/fixtures
      - name: Build riff.zip
        run: |
          set -euo pipefail
          mkdir -p build/riff
          rsync -a --exclude-from='.distignore' ./plugins/riff/ build/riff/
          (cd build && zip -qr riff.zip riff/)
          test -f build/riff/riff.php
          find build/riff -name '*.php' -print0 | xargs -0 -n1 -P 4 php -l > /dev/null
      - name: Assemble the site
        id: site
        run: |
          set -euo pipefail
          mkdir -p out/demo
          cp -R site/. out/
          cp build/riff.zip out/
          cp packages/fixtures/seed.php out/demo/
          find packages/fixtures/compositions -maxdepth 1 -type f ! -name 'cover-*' -exec cp {} out/demo/ \;
          cp site/brand/mark.png out/demo/
          # The streamed albums: audio under demo/<slug>/, each manifest and its levels flat beside
          # the seed, and base.txt, where the seed finds the audio.
          for m in packages/fixtures/*/manifest.json; do
            slug=$(basename "$(dirname "$m")")
            node -e "process.exit(require('./$m').remote ? 0 : 1)" || continue
            mkdir -p "out/demo/$slug"
            cp ~/.cache/riff-albums/built/"$slug"/*.mp3 "out/demo/$slug/"
            cp "$m" "out/demo/$slug.manifest.json"
            cp "$(dirname "$m")/levels.json" "out/demo/$slug.levels.json"
          done
          printf '%sdemo/' "$(printf '%s' "$SITE_URL" | sed -E 's#^http://#https://#; s#/*$#/#')" > out/demo/base.txt
          du -sh out/demo
          # Playground runs on https and a browser will not fetch http from it, so the scheme is always https.
          BASE=$(printf '%s' "$SITE_URL" | sed -E 's#^http://#https://#; s#/*$#/#')
          [[ "$BASE" =~ ^https://[^/]+/ ]] || { echo "::error::Unexpected site URL: $BASE"; exit 1; }
          # Stamp every asset URL with the commit so a deploy is always a new URL: the page's images and its
          # blueprint fetch, and the blueprint's zip and demo files.
          V="${GITHUB_SHA::7}"
          sed -i -E "s#\{\{pages_url\}\}#${BASE}#g; s#(src=\"[^\"?]+\.png)\"#\1?v=${V}\"#g; s#(\.avif)( [0-9]+w)?(,|\")#\1?v=${V}\2\3#g; s#(content=\"[^\"?]+/og\.png)\"#\1?v=${V}\"#; s#(\"image\": \"[^\"?]+\.png)\"#\1?v=${V}\"#g; s#(blueprint-url=[^\"&?]+/blueprint\.json)#\1?v=${V}#g" out/index.html
          grep -c "blueprint.json?v=${V}" out/index.html
          sed -i -E "s#\{\{pages_url\}\}#${BASE}#g" out/robots.txt out/sitemap.xml
          find out/web -name index.html -exec sed -i -E "s#\{\{pages_url\}\}#${BASE}#g; s#\{\{commit\}\}#${GITHUB_SHA}#g" {} +
          if grep -rn '{{' out/index.html out/robots.txt out/sitemap.xml out/web; then echo "::error::A placeholder survived"; exit 1; fi
          node .github/scripts/demo-blueprint.js resolve blueprint.json "$BASE" "$V" > out/blueprint.json
          grep -c "?v=${V}" out/index.html out/blueprint.json
          # Everything stamped by commit can be cached forever; the page and the blueprint are fetched fresh.
          cat > out/_headers <<'HEADERS'
          /demo/*
            Cache-Control: public, max-age=31536000, immutable
          /riff.zip
            Cache-Control: public, max-age=31536000, immutable
          /:name.png
            Cache-Control: public, max-age=31536000, immutable
          /:name.avif
            Cache-Control: public, max-age=31536000, immutable
          /fonts/*
            Cache-Control: public, max-age=31536000, immutable
          /index.html
            Cache-Control: no-cache
          /blueprint.json
            Cache-Control: no-cache
          HEADERS
          # A stable address for the demo: /demo always sends to Playground with the current stamped
          # blueprint, so nothing outside this deploy has to know the stamp.
          printf '/demo https://playground.wordpress.net/?mode=seamless&blueprint-url=%sblueprint.json?v=%s 302\n' "$BASE" "$V" > out/_redirects
          cat out/_redirects
          ls -la out out/demo
          { echo "base=$BASE"; echo "version=$V"; } >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi
          # Creating the project fails harmlessly once it exists.
          npx --yes wrangler@4 pages project create "$PROJECT" --production-branch main 2> /dev/null || true
          npx --yes wrangler@4 pages deploy out --project-name "$PROJECT" --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true
      # The deploy reports success whether or not the demo can load what it names. Ask for each file the
      # way Playground will, from another origin, so a dead URL fails here instead of on a visitor.
      - name: Check every file the demo fetches
        env:
          BLUEPRINT: ${{ steps.site.outputs.base }}blueprint.json?v=${{ steps.site.outputs.version }}
        run: node .github/scripts/demo-blueprint.js check "$BLUEPRINT" 18

  # GitHub Pages keeps the old address alive as a redirect to the site.
  redirect:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: A page that sends the old address on
        env:
          BASE: ${{ needs.deploy.outputs.base }}
        run: |
          set -euo pipefail
          mkdir -p redirect
          cat > redirect/index.html <<HTML
          <!doctype html><html lang="en"><head><meta charset="utf-8"><title>Riff</title><meta http-equiv="refresh" content="0; url=${BASE}"><link rel="canonical" href="${BASE}"><meta name="robots" content="noindex"></head><body><p>Riff has moved to <a href="${BASE}">${BASE}</a>.</p></body></html>
          HTML
          cp redirect/index.html redirect/404.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: redirect
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
