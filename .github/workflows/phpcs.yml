name: PHPCS

on:
  workflow_call:

permissions:
  contents: read

jobs:
  phpcs:
    name: WordPress Coding Standards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --prefer-dist
      - run: ./vendor/bin/phpcs --standard=phpcs.xml.dist
      # The text domain rule above passes on a wrong domain if its setting is ever lost, so this
      # shows it still fails on one: a wrong domain, a missing one, and Riff Lyrics using Riff's.
      - name: The text domain check catches a wrong domain
        run: .github/scripts/text-domain-check.sh
