name: PHPUnit

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpunit:
    name: WordPress test suite (PHP ${{ matrix.php }}, ${{ matrix.core }}, ${{ matrix.multisite && 'multisite' || 'single site' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The floor the plugin claims, PHP 8.1 on WordPress 7.0, so Requires at least is tested and not
    # just written down; the newest PHP on the current WordPress; a network on the one in between;
    # and core trunk, which is where a plugin aiming at core finds out first. Trunk does not block a
    # merge, since a nightly can break on its own, but it shows.
    continue-on-error: ${{ matrix.core == 'trunk' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', core: '7.1',    multisite: false }
          - { php: '8.3', core: 'latest', multisite: true }
          - { php: '8.5', core: 'latest', multisite: false }
          - { php: '8.5', core: 'trunk',  multisite: false }
    env:
      WP_ENV_PHP_VERSION: ${{ matrix.php }}
      # The mirror's nightly branch is master; trunk is what WordPress calls it. Empty leaves the
      # core to .wp-env.json, which names the 7.2 build Riff is developed on: the current beta or
      # release candidate until 7.2 ships (8 December 2026), then the release. Until then 7.2 and
      # latest are that same build, and a release line's branch (WordPress/WordPress#7.2) takes
      # over once it exists. 7.1 is the oldest WordPress Riff runs on, with the oldest PHP. It is the
      # 7.1 tag, not 7.1-branch: the branch calls itself an alpha, and wp-env pairs an alpha with
      # trunk's test library, which needs the newer core.
      WP_ENV_CORE: ${{ matrix.core == 'trunk' && 'WordPress/WordPress#master' || matrix.core == '7.1' && 'WordPress/WordPress#7.1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
      # Dev dependencies, unlike the E2E job: PHPUnit and the polyfills are the point here.
      - run: composer install --no-interaction --prefer-dist
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # The tests run inside the container, against the core PHPUnit library wp-env mounts
      # at /wordpress-phpunit and the same WordPress the E2E suite uses.
      - run: npm run env:start
      - run: npm run test:php
        if: ${{ ! matrix.multisite }}
      # The same suite on a network, with WP_TESTS_MULTISITE=1.
      - run: npm run test:php:multisite
        if: ${{ matrix.multisite }}

      - name: WordPress debug log
        if: ${{ failure() }}
        run: npx wp-env run tests-cli -- cat wp-content/debug.log || true
