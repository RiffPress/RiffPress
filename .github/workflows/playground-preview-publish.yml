name: Playground Preview Publish

# Runs in the base-repo context so it can write even for fork pull requests.
# Downloads the build from the triggering "Playground Preview" run, pushes it
# to a per-PR preview-pr-N branch that raw.githubusercontent.com serves with
# CORS, and posts (or updates) a sticky comment with the Playground link. Every
# PR-derived input is validated; the blueprint comes from the base ref, only
# asset URLs are rewritten, and those always point at this repository. The demo
# set rides along in the build artifact, and only the files the base-ref
# blueprint names are copied out of it.
#
# For a pull request from this repository (not a fork, whose pages would be
# published under the project's address), the site it built is deployed as a
# Cloudflare Pages preview at pr-N.riffpress.pages.dev, with that same
# Playground blueprint as its blueprint.json, so its "Try the demo" opens the
# pull request's own build. Its placeholders are filled by the base branch's
# site-preview.js, which only rewrites text, and it asks not to be indexed.

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] never checks out or executes pull request code
    workflows: ["Playground Preview"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download artifacts from the triggering run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const list = await github.rest.actions.listWorkflowRunArtifacts({ owner: context.repo.owner, repo: context.repo.repo, run_id: context.payload.workflow_run.id });
            for (const name of ['release-assets', 'pr-meta', 'site']) {
              const found = list.data.artifacts.find(a => a.name === name);
              // The site is optional: a run from before it was built has none.
              if (!found && name === 'site') continue;
              if (!found) { core.setFailed(`Required artifact "${name}" not found.`); return; }
              const dl = await github.rest.actions.downloadArtifact({ owner: context.repo.owner, repo: context.repo.repo, artifact_id: found.id, archive_format: 'zip' });
              fs.writeFileSync(`${name}.zip`, Buffer.from(dl.data));
            }
      - name: Unpack and validate artifacts
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TRUSTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/release-assets artifacts/pr-meta
          # The pull request wrote these archives, so refuse any entry that is a link or leaves its folder
          # before unzip can restore it: a link would let the copy below publish a file from this runner.
          for z in release-assets.zip pr-meta.zip $(test -f site.zip && echo site.zip); do
            if zipinfo -1 "$z" | grep -qE '(^/|(^|/)\.\.(/|$))'; then echo "::error::$z has an entry outside its folder"; exit 1; fi
            if zipinfo "$z" | grep -qE '^l'; then echo "::error::$z contains a symlink"; exit 1; fi
          done
          unzip -q -o -d artifacts/release-assets release-assets.zip
          unzip -q -o -d artifacts/pr-meta pr-meta.zip
          if test -f site.zip; then mkdir -p artifacts/site && unzip -q -o -d artifacts/site site.zip; fi
          test -f artifacts/release-assets/riff.zip
          META_HEAD_SHA=$(jq -r '.head_sha' artifacts/pr-meta/pr-meta.json)
          [[ "$META_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid SHA in pr-meta"; exit 1; }
          [[ "$META_HEAD_SHA" == "$TRUSTED_HEAD_SHA" ]] || { echo "pr-meta SHA does not match the triggering run"; exit 1; }
          readarray -t _prs < <(gh api "repos/${GH_REPO}/pulls?state=open&per_page=100" --paginate --jq '.[] | select(.head.sha == env.TRUSTED_HEAD_SHA) | .number')
          PR_NUMBER="${_prs[0]:-}"
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::notice::No open pull request at $TRUSTED_HEAD_SHA; nothing to publish."
            echo "skipped=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          { echo "pr_number=$PR_NUMBER"; echo "head_sha=$TRUSTED_HEAD_SHA"; } >> "$GITHUB_OUTPUT"
      - name: Publish preview assets
        if: steps.meta.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.meta.outputs.pr_number }}
          HEAD_SHA: ${{ steps.meta.outputs.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p "preview/${HEAD_SHA}" && cp artifacts/release-assets/riff.zip "preview/${HEAD_SHA}/"
          # Only the demo files the base-ref blueprint names, each checked to be a plain file of a sane size,
          # laid out beside the zip the same way Pages lays them out.
          node .github/scripts/demo-blueprint.js stage blueprint.json artifacts/release-assets/demo "preview/${HEAD_SHA}/demo"
          cd preview
          git init -q -b "preview-pr-${PR_NUMBER}"
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm "Playground preview for PR #${PR_NUMBER} at ${HEAD_SHA}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "preview-pr-${PR_NUMBER}"
      - name: Assemble the Playground URL from the base-ref blueprint
        id: playground
        if: steps.meta.outputs.skipped != 'true'
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.meta.outputs.pr_number }}
          HEAD_SHA: ${{ steps.meta.outputs.head_sha }}
        run: |
          set -euo pipefail
          # blueprint.json names its zip and demo files relative to itself, so the preview branch, laid out
          # like the Pages site, resolves every one of them to this pull request's own copy.
          BASE="https://raw.githubusercontent.com/${REPO}/preview-pr-${PR_NUMBER}/${HEAD_SHA}/"
          node .github/scripts/demo-blueprint.js resolve blueprint.json "$BASE" > preview-blueprint.json
          # A link to a demo that cannot load its files is worse than no link; wait out the push, then fail.
          node .github/scripts/demo-blueprint.js check preview-blueprint.json 30
          echo "url=https://playground.wordpress.net/?mode=seamless#$(jq -c . preview-blueprint.json | base64 -w0)" >> "$GITHUB_OUTPUT"
      - name: Publish the site preview
        id: site
        if: steps.meta.outputs.skipped != 'true' && github.event.workflow_run.head_repository.full_name == github.repository && hashFiles('artifacts/site/index.html') != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.meta.outputs.pr_number }}
          HEAD_SHA: ${{ steps.meta.outputs.head_sha }}
        run: |
          set -euo pipefail
          BASE="https://pr-${PR_NUMBER}.riffpress.pages.dev/"
          VERSION=$(unzip -p artifacts/release-assets/riff.zip riff/riff.php | sed -nE 's/^ \* Version: *([0-9][0-9A-Za-z.-]*).*$/\1/p' | head -n1)
          STABLE=$(curl -fsSL -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GH_REPO}/releases/latest" | jq -r '.tag_name | ltrimstr("riff-") | ltrimstr("v")')
          [[ -n "$STABLE" && "$STABLE" != null ]] || STABLE="$VERSION"
          cp preview-blueprint.json artifacts/site/blueprint.json
          node .github/scripts/site-preview.js artifacts/site "$BASE" "$VERSION" "$STABLE" "$HEAD_SHA"
          npx --yes wrangler@4 pages deploy artifacts/site --project-name riffpress --branch "pr-${PR_NUMBER}" --commit-hash "$HEAD_SHA" --commit-dirty=true
          echo "url=$BASE" >> "$GITHUB_OUTPUT"
      - name: Post or update the sticky comment
        if: steps.meta.outputs.skipped != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.meta.outputs.pr_number }}
          HEAD_SHA: ${{ steps.meta.outputs.head_sha }}
          PLAYGROUND_URL: ${{ steps.playground.outputs.url }}
          SITE_URL: ${{ steps.site.outputs.url }}
        with:
          script: |
            const marker = '<!-- riff:playground-preview -->';
            const sha = process.env.HEAD_SHA;
            const commitUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${sha}`;
            // Four ways in, named for where each lands: the same Playground build opened on the
            // standalone app (the blueprint's landing page), on the Listen page inside the theme, or
            // on an album's post, and the pull request's own site.
            const play = process.env.PLAYGROUND_URL;
            const at = ( path ) => play.replace( '?mode=seamless', `?mode=seamless&url=${ encodeURIComponent( path ) }` );
            const inTheme = at( '/listen/' );
            const onPost = at( '/compositions/' );
            const site = process.env.SITE_URL;
            const button = ( label, colour, logo ) => `https://img.shields.io/badge/${ encodeURIComponent( label ).replace( /-/g, '--' ) }-${ colour }?style=for-the-badge${ logo ? `&logo=${ logo }&logoColor=white` : '' }`;
            const buttons = [
              `[![Standalone app](${ button( 'Standalone app', '3858E9', 'wordpress' ) })](${ play })`,
              `[![Listen page](${ button( 'Listen page', '3858E9', 'wordpress' ) })](${ inTheme })`,
              `[![Blog post](${ button( 'Blog post', '3858E9', 'wordpress' ) })](${ onPost })`,
              site ? `[![Website](${ button( 'Website', '1E1E1E' ) })](${ site })` : '',
            ].filter( Boolean ).join( ' ' );
            const body = [
              marker,
              '### 🛝 Preview',
              '',
              `Built from <a href="${commitUrl}"><samp>${sha.slice(0, 7)}</samp></a>, signed in as admin.`,
              '',
              buttons,
              '',
              '<sub><b>Standalone app</b> is <code>/listen/app/</code>, the installable player with no theme around it. <b>Listen page</b> is <code>/listen/</code>, the same player as a block inside the theme. <b>Blog post</b> is an album post with its Riff block. <b>Website</b> is riffpress.com as this branch builds it.</sub>',
              '',
            ].join('\n');
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const comments = await github.paginate(github.rest.issues.listComments, { owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, body });
