name: Playground Preview

# Builds riff.zip and the site from the pull request commit and uploads them
# as artifacts. "Playground Preview Publish" hosts them and comments on the
# pull request, so every pull request gets a one-click Playground of its own
# build and, from this repository, a preview of its own site.
# Pull request code is untrusted here: read-only token, no composer or npm
# install scripts.

on:
  pull_request:
    # The preview plays the pull request's own demo set, so a change to it is worth a new preview even
    # though the rest of tests/ is not. The last pattern that matches a path decides.
    paths:
      - '**'
      - '!**.md'
      - '!.github/**'
      - '!**/tests/**'
      - 'packages/fixtures/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # Building an album the pull request adds or changes downloads and encodes its recordings.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version-file: .php-version
          coverage: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Build the site
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run site:js
          # The reference pages, as the Pages workflow builds them from the commit.
          node .github/scripts/hooks-reference.js
          node .github/scripts/js-reference.js
          node .github/scripts/reference-pages.js
          node .github/scripts/web-pages.js
          mkdir -p build && cp -R site build/site
          node .github/scripts/no-widows.js build/site
      - name: Build riff.zip
        run: |
          set -euo pipefail
          bash .github/scripts/build-riff.sh
          (cd build && zip -qr riff.zip riff/)
          # The demo set travels beside the zip, the same selection the Pages workflow publishes, so the
          # preview plays this pull request's recordings rather than whatever main last published.
          mkdir -p build/demo
          cp packages/fixtures/seed.php build/demo/
          find packages/fixtures/compositions -maxdepth 1 -type f ! -name 'cover-*' -exec cp {} build/demo/ \;
          cp site/brand/mark.png build/demo/
          printf 'https://riffpress.com/demo/' > build/demo/base.txt
      - name: Keep the album downloads between runs
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/riff-albums/src
          key: albums-src-${{ hashFiles('packages/fixtures/*/source.json') }}
          restore-keys: albums-
      - name: Build the albums this pull request adds or changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # An album is built here when its source.json differs from the base (a change to album.js alone
          # is left to the deploy, since it would rebuild every album), so
          # the preview plays its recordings before the site has published them; the rest play from
          # the site. The publisher copies only these albums' own tracks out of the build.
          git fetch -q --depth=1 origin "$BASE_SHA"
          built=()
          for m in packages/fixtures/*/manifest.json; do
            slug=$(basename "$(dirname "$m")")
            node -e "process.exit(require('./$m').remote ? 0 : 1)" || continue
            if git diff --quiet "$BASE_SHA" -- "packages/fixtures/$slug/source.json" \
              && git cat-file -e "$BASE_SHA:packages/fixtures/$slug/source.json" 2>/dev/null; then continue; fi
            built+=("$slug")
          done
          if (( ${#built[@]} )); then
            sudo apt-get install -y -qq ffmpeg > /dev/null
            for slug in "${built[@]}"; do
              RIFF_JAZZ_CACHE=~/.cache/riff-albums/src node packages/fixtures/album.js "$slug" --out "build/demo/$slug"
            done
            # album.js rewrites the manifest it builds from; the preview seeds the committed one.
            git checkout -- packages/fixtures
          fi
          node .github/scripts/demo-albums.js bundle packages/fixtures build/demo/albums.json "${built[@]}"
          echo "Built here: ${built[*]:-none}"
      - name: Smoke-test the build
        run: |
          set -euo pipefail
          test -f build/riff/riff.php
          find build/riff -name '*.php' -print0 | xargs -0 -n1 -P 4 php -l > /dev/null
      - name: Schema-validate the blueprint
        run: |
          jq -e '(.steps | length > 0) and (.steps | map(select(.step == "installPlugin" and (.pluginData.resource // "") == "url")) | length == 1)' blueprint.json > /dev/null
      - name: Save pull request metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          jq -n --argjson pr "$PR_NUMBER" --arg sha "$HEAD_SHA" '{pr_number: $pr, head_sha: $sha}' > pr-meta.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            build/riff.zip
            build/demo/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: build/site/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-meta
          path: pr-meta.json
          retention-days: 14
          if-no-files-found: error
