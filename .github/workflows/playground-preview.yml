name: Playground Preview

# Builds riff.zip and the site from the pull request commit and uploads them
# as artifacts. "Playground Preview Publish" hosts them and comments on the
# pull request, so every pull request gets a one-click Playground of its own
# build and, from this repository, a preview of its own site.
# Pull request code is untrusted here: read-only token, no composer or npm
# install scripts.

on:
  pull_request:
    # The preview plays the pull request's own demo set, so a change to it is worth a new preview even
    # though the rest of tests/ is not. The last pattern that matches a path decides.
    paths:
      - '**'
      - '!**.md'
      - '!.github/**'
      - '!**/tests/**'
      - 'packages/fixtures/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version-file: .php-version
          coverage: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Build the site
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run site:js
          # The reference pages, as the Pages workflow builds them from the commit.
          node .github/scripts/hooks-reference.js
          node .github/scripts/js-reference.js
          node .github/scripts/reference-pages.js
          node .github/scripts/web-pages.js
          mkdir -p build && cp -R site build/site
          node .github/scripts/no-widows.js build/site
      - name: Build riff.zip
        run: |
          set -euo pipefail
          mkdir -p build/riff
          rsync -a --exclude-from='.distignore' ./plugins/riff/ build/riff/
          (cd build && zip -qr riff.zip riff/)
          # The demo set travels beside the zip, the same selection the Pages workflow publishes, so the
          # preview plays this pull request's recordings rather than whatever main last published.
          mkdir -p build/demo
          cp packages/fixtures/seed.php build/demo/
          find packages/fixtures/compositions -maxdepth 1 -type f ! -name 'cover-*' -exec cp {} build/demo/ \;
          cp site/brand/mark.png build/demo/
          for m in packages/fixtures/*/manifest.json; do
            slug=$(basename "$(dirname "$m")")
            node -e "process.exit(require('./$m').remote ? 0 : 1)" || continue
            cp "$m" "build/demo/$slug.manifest.json"
            cp "$(dirname "$m")/levels.json" "build/demo/$slug.levels.json"
          done
          printf 'https://riffpress.com/demo/' > build/demo/base.txt
      - name: Smoke-test the build
        run: |
          set -euo pipefail
          test -f build/riff/riff.php
          find build/riff -name '*.php' -print0 | xargs -0 -n1 -P 4 php -l > /dev/null
      - name: Schema-validate the blueprint
        run: |
          jq -e '(.steps | length > 0) and (.steps | map(select(.step == "installPlugin" and (.pluginData.resource // "") == "url")) | length == 1)' blueprint.json > /dev/null
      - name: Save pull request metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          jq -n --argjson pr "$PR_NUMBER" --arg sha "$HEAD_SHA" '{pr_number: $pr, head_sha: $sha}' > pr-meta.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            build/riff.zip
            build/demo/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: build/site/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-meta
          path: pr-meta.json
          retention-days: 14
          if-no-files-found: error
