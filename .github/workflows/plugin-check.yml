name: Plugin Check

# Runs the WordPress.org Plugin Check plugin against the built zip, the same
# thing the directory runs on submission. Errors fail the job; warnings print.
# CI calls it on every change to the code.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build the plugin the way a release does
        run: |
          set -euo pipefail
          mkdir -p build/riff
          rsync -a --exclude-from='.distignore' ./plugins/riff/ build/riff/

      - name: Mount the built plugin instead of the checkout
        run: |
          cat > .wp-env.override.json <<'JSON'
          { "plugins": [ "./build/riff" ], "mappings": {} }
          JSON

      - run: npx wp-env start

      - name: Install Plugin Check
        run: |
          npx wp-env run cli wp plugin install plugin-check --activate
          npx wp-env run cli wp plugin activate riff

      # The translation template is generated, not committed: translations come from
      # translate.wordpress.org, and a release carries the template for everyone else.
      - name: Generate the translation template into the built plugin
        run: npm run -s pot

      # "Tested up to" is written by scripts/sync-versions.sh at release time
      # from the core version the suite just ran against, so it is allowed to
      # lag between releases.
      - name: Run Plugin Check
        run: |
          set -euo pipefail
          npx wp-env run cli wp plugin check riff \
            --format=strict-json \
            --ignore-codes=outdated_tested_upto_header \
            --fields=file,line,column,type,code,message > plugin-check.json

          # With nothing to report the command prints a success line, not JSON.
          if ! jq -e . plugin-check.json > /dev/null 2>&1; then
            cat plugin-check.json
            grep -q '^Success' plugin-check.json && { echo "Plugin Check reported nothing."; exit 0; }
            echo "::error::Plugin Check produced no result"
            exit 1
          fi
          jq -r '.[] | "\(.type)  \(.file):\(.line):\(.column)  \(.code)\n    \(.message)"' plugin-check.json

          errors="$( jq '[ .[] | select( .type == "ERROR" ) ] | length' plugin-check.json )"
          if [ "$errors" -gt 0 ]; then
            echo "Plugin Check reported $errors error(s)."
            exit 1
          fi

      - name: Stop the testing environment
        if: ${{ always() }}
        run: npx wp-env stop || true
