name: Release Please

on:
  push:
    branches: [main]
  # A Dependabot pull request that merges itself lands on main as a commit
  # attributed to the workflow token, and that never starts a push workflow.
  # The weekly run picks up anything such merges left behind.
  schedule:
    - cron: '47 6 * * 1'
  workflow_dispatch:

# Never cancel a run in flight: this workflow tags and uploads release assets,
# and a cancelled run leaves a release half-finished. A superseded run costs a
# few minutes; a cancelled one costs a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    # Six packages release on their own (release-please-config.json), so
    # each output is read under its package's path.
    outputs:
      riff_release: ${{ steps.release.outputs['plugins/riff--release_created'] }}
      riff_tag: ${{ steps.release.outputs['plugins/riff--tag_name'] }}
      riff_version: ${{ steps.release.outputs['plugins/riff--version'] }}
      lyrics_release: ${{ steps.release.outputs['plugins/riff-lyrics--release_created'] }}
      lyrics_tag: ${{ steps.release.outputs['plugins/riff-lyrics--tag_name'] }}
      chords_release: ${{ steps.release.outputs['plugins/riff-chords--release_created'] }}
      chords_tag: ${{ steps.release.outputs['plugins/riff-chords--tag_name'] }}
      sign_in_release: ${{ steps.release.outputs['plugins/riff-sign-in--release_created'] }}
      sign_in_tag: ${{ steps.release.outputs['plugins/riff-sign-in--tag_name'] }}
      sing_release: ${{ steps.release.outputs['plugins/riff-sing--release_created'] }}
      sing_tag: ${{ steps.release.outputs['plugins/riff-sing--tag_name'] }}
      chimera_release: ${{ steps.release.outputs['plugins/riff-chimera--release_created'] }}
      chimera_tag: ${{ steps.release.outputs['plugins/riff-chimera--tag_name'] }}
      coverage_release: ${{ steps.release.outputs['packages/wp-api-coverage--release_created'] }}
      coverage_tag: ${{ steps.release.outputs['packages/wp-api-coverage--tag_name'] }}
      release_branches: ${{ steps.release-prs.outputs.branches }}
    steps:
      # A release pull request is a draft until sync-versions below has written
      # and checked its version strings, so nobody, an admin included, can merge
      # it while it says one version in the manifest and another in the plugins:
      # GitHub refuses to merge a draft. release-please opens it as a draft
      # (draft-pull-request in release-please-config.json) but leaves an open one
      # as it is when it rebuilds the branch, dropping the sync commit, so it is
      # made a draft again here, before release-please touches it. When this
      # fails, nothing runs: a rebuild with the pull request still mergeable is
      # how 6.12.0, 6.13.0, 6.14.1 and 6.14.2 were tagged on unsynced commits.
      - name: Hold the open release pull request as a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # This repository's branch only: a fork's pull request can use the same branch name.
          OPEN=$(gh pr list --state open --head release-please--branches--main --json number,isDraft,isCrossRepository --jq '.[] | select((.isDraft | not) and (.isCrossRepository | not)) | .number')
          for NUMBER in $OPEN; do
            for attempt in 1 2 3; do
              if gh pr ready "$NUMBER" --undo; then
                echo "#$NUMBER is a draft until its versions are synced."
                continue 2
              fi
              sleep $(( attempt * 10 ))
            done
            echo "::error::Could not make release pull request #$NUMBER a draft, so release-please was not run: rebuilding it while it can be merged could release an unsynced tree. Re-run this workflow."
            exit 1
          done
      # GITHUB_TOKEN can open the release pull request because "Allow GitHub
      # Actions to create and approve pull requests" is on for the repository.
      # GitHub holds that pull request's CI runs for approval; the sync-versions
      # job below approves them. A RELEASE_PLEASE_TOKEN secret (PAT or app
      # token) is honored if one is ever added.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
      # Every open release pull request, for sync-versions below. It looks for
      # them itself rather than reading release-please's outputs: those name a
      # pull request only on runs that touched it, and a push of chore commits
      # leaves a release pull request untouched but still needing its checks.
      - name: Find the open release pull requests
        id: release-prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # By branch, not --search: the search index lags, and a pull request
          # release-please opened a second ago is not in it yet.
          BRANCHES=$(gh pr list --state open --head release-please--branches--main --json headRefName --jq '[.[] | .headRefName]')
          echo "Open release branches: $BRANCHES"
          echo "branches=$BRANCHES" >> "$GITHUB_OUTPUT"

  # release-please only updates the manifest and each package's CHANGELOG.md.
  # The plugin headers, version defines, readme.txt Stable tags and the
  # package.json files are synced by scripts/sync-versions.sh, the same script
  # a maintainer runs locally, so the CI behavior is grep-able. Every package
  # with changes releases from one pull request (release-please-config.json),
  # each with its own version, tag, changelog and release; only the packages
  # whose version that pull request moves are synced, so a package it does not
  # release is left as it is. One pull request writes the manifest once, so
  # two releases never conflict over its neighbouring lines.
  sync-versions:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_branches != '[]' && needs.release-please.outputs.release_branches != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.release-please.outputs.release_branches) }}
    permissions:
      contents: write
      # Marking the pull request ready for review once its versions are synced.
      pull-requests: write
      # Approving held workflow runs needs actions: write.
      actions: write
    steps:
      # The pull request can merge between release-please's job and this one,
      # and GitHub then deletes its branch; there is nothing left to sync.
      - name: Check the release branch still exists
        id: branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ matrix.branch }}
        run: |
          set -euo pipefail
          if gh api "repos/${GH_REPO}/branches/${BRANCH}" --silent 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${BRANCH} no longer exists (its pull request merged or closed); nothing to sync."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.branch.outputs.exists == 'true'
        with:
          persist-credentials: false
          ref: ${{ matrix.branch }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.branch.outputs.exists == 'true'
        with:
          node-version-file: .nvmrc
      # release-please rebuilds a release pull request only when its package's
      # changelog would change, so a fix outside the package (to CI, say) leaves
      # the branch on an older main, failing checks main already passes. Main is
      # merged in here and pushed with the synced versions below; release-please
      # replaces the branch outright the next time it rebuilds it.
      - name: Bring the release branch up to date with main
        if: steps.branch.outputs.exists == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
          fi
      # The packages this pull request releases are the ones whose manifest
      # version differs from main's; each is synced by its component name.
      - name: Sync the version strings of the packages it releases
        if: steps.branch.outputs.exists == 'true'
        run: |
          set -euo pipefail
          CHANGED=$(jq -r --argjson main "$(git show origin/main:.release-please-manifest.json)" 'to_entries[] | select(.value != $main[.key]) | .key' .release-please-manifest.json)
          if [[ -z "$CHANGED" ]]; then
            echo "No package's version moves; nothing to sync."
            exit 0
          fi
          for path in $CHANGED; do
            component=$(jq -r --arg path "$path" '.packages[$path].component' release-please-config.json)
            [[ -n "$component" && "$component" != null ]] || { echo "::error::No component for $path"; exit 1; }
            echo "Syncing $component ($path)"
            bash scripts/sync-versions.sh "$component"
          done
      - name: Commit synced versions back to the release pull request
        if: steps.branch.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ matrix.branch }}
        run: |
          if ! git diff --quiet; then
            git add -u
            git commit -m "chore: sync version strings"
          fi
          if [ "$(git rev-list --count "origin/${BRANCH}..HEAD")" -gt 0 ]; then
            gh auth setup-git
            git push
          fi
      # main requires the CI checks, and GitHub holds the pull_request runs
      # for a pull request opened by GITHUB_TOKEN until someone approves them.
      # Approving from here lets CI run the full suite on the exact commit that
      # will be tagged, and those runs are the ones the merge box counts.
      # (A workflow_dispatch run on the same commit is not; its check runs
      # never reach the pull request's status rollup.)
      - name: Approve the held CI runs on the release branch
        if: steps.branch.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          # The push above may take a moment to surface as a held run.
          for _ in $(seq 12); do
            RUNS=$(gh api "repos/${GH_REPO}/actions/runs?head_sha=${HEAD_SHA}&status=action_required&per_page=50" --jq '.workflow_runs[].id')
            [[ -n "$RUNS" ]] && break
            sleep 10
          done
          if [[ -z "$RUNS" ]]; then
            echo "No held runs on ${HEAD_SHA}; nothing to approve."
            exit 0
          fi
          for RUN in $RUNS; do
            gh api --method POST "repos/${GH_REPO}/actions/runs/${RUN}/approve" >/dev/null
            echo "Approved run ${RUN}."
          done
      # The one way out of draft: the commit on the branch is the one checked
      # here, and every plugin's header, define, Stable tag and readme changelog
      # say what the manifest and CHANGELOG.md say. A release-please rebuild
      # since the push leaves the branch on another commit, and it stays a draft
      # for the next run to sync.
      - name: Mark the release pull request ready once its versions are synced
        if: steps.branch.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ matrix.branch }}
        run: |
          set -euo pipefail
          node .github/scripts/release-check.js tree
          node .github/scripts/readme-changelog.js --check
          HEAD_SHA=$(git rev-parse HEAD)
          REMOTE_SHA=$(gh api "repos/${GH_REPO}/branches/${BRANCH}" --jq .commit.sha)
          if [[ "$REMOTE_SHA" != "$HEAD_SHA" ]]; then
            echo "::notice::${BRANCH} moved to ${REMOTE_SHA} after ${HEAD_SHA} was synced; it stays a draft until the next run syncs it."
            exit 0
          fi
          NUMBER=$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')
          [[ -n "$NUMBER" ]] || exit 0
          gh pr ready "$NUMBER"
          echo "#$NUMBER is synced at ${HEAD_SHA} and ready to merge."

  # When Riff's release pull request merges, release-please tags the commit and
  # creates the GitHub release as a draft. Releases here are immutable once
  # published, so the zip is attached to the draft and the release is published
  # after that.
  build-release-asset:
    needs: release-please
    if: ${{ needs.release-please.outputs.riff_release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      # attest-build-provenance signs with the workflow's identity and stores the attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tagged commit, not the run's: a scheduled or manual run releases what an
          # earlier merge tagged, and the zip must rebuild from the tag (docs/verify.md).
          ref: ${{ needs.release-please.outputs.riff_tag }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          coverage: none
      - name: Build riff.zip
        run: |
          set -euo pipefail
          bash .github/scripts/build-zip.sh riff
      - name: Smoke-test the build
        run: |
          set -euo pipefail
          test -f build/riff/riff.php
          find build/riff -name '*.php' -print0 | xargs -0 -n1 -P 4 php -l > /dev/null
      # What ships must say what the tag says: header, version define, Stable tag.
      - name: Check the zip is the tag's version
        env:
          TAG_NAME: ${{ needs.release-please.outputs.riff_tag }}
        run: node .github/scripts/release-check.js zip "$TAG_NAME" build/riff.zip
      # A host can check this zip came from this workflow, at this commit, before installing it:
      # gh attestation verify riff.zip --repo RiffPress/RiffPress (docs/verify.md).
      - name: Attest the zip's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/riff.zip
      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.riff_tag }}
        run: gh release upload --clobber "$TAG_NAME" build/riff.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.riff_tag }}
        run: bash .github/scripts/publish-release.sh "$TAG_NAME" plugins/riff/riff.php latest

  # After the GitHub release is published, the same build goes to the plugin's
  # WordPress.org SVN repository, with the banner, icon and screenshots from
  # .wordpress-org/. It stays off until the repository variable WPORG_DEPLOY is
  # "true", which is set once WordPress.org has approved the plugin and the
  # SVN_USERNAME and SVN_PASSWORD secrets exist.
  deploy-wordpress-org:
    needs: [release-please, build-release-asset]
    if: ${{ needs.release-please.outputs.riff_release && vars.WPORG_DEPLOY == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: wordpress-org
    permissions:
      contents: read
      # gh attestation verify reads the zip's attestation.
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tag, for .wordpress-org/ as it was released; a scheduled run's own commit is newer.
          ref: ${{ needs.release-please.outputs.riff_tag }}
      # WordPress.org gets the very zip the GitHub release carries, not a rebuild: it is checked
      # against its attestation and its tag's version first, and nothing is sent if either fails.
      - name: Fetch and check the released zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.riff_tag }}
        run: |
          set -euo pipefail
          mkdir -p build
          gh release download "$TAG_NAME" --pattern riff.zip --dir build
          gh attestation verify build/riff.zip --repo "$GH_REPO"
          node .github/scripts/release-check.js zip "$TAG_NAME" build/riff.zip
          unzip -q build/riff.zip -d build
          test -f build/riff/riff.php
      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: riff
          BUILD_DIR: build/riff
          ASSETS_DIR: .wordpress-org
          VERSION: ${{ needs.release-please.outputs.riff_version }}

  # Riff Lyrics' release: its own zip on its own GitHub release, built the way
  # Riff's is. It is never marked the latest release; that stays Riff's.
  release-riff-lyrics:
    needs: release-please
    if: ${{ needs.release-please.outputs.lyrics_release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      # attest-build-provenance signs with the workflow's identity and stores the attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tagged commit, not the run's: a scheduled or manual run releases what an
          # earlier merge tagged, and the zip must rebuild from the tag (docs/verify.md).
          ref: ${{ needs.release-please.outputs.lyrics_tag }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          coverage: none
      - name: Build riff-lyrics.zip
        run: |
          set -euo pipefail
          bash .github/scripts/build-zip.sh riff-lyrics
      - name: Smoke-test the build
        run: |
          set -euo pipefail
          test -f build/riff-lyrics/riff-lyrics.php
          find build/riff-lyrics -name '*.php' -print0 | xargs -0 -n1 -P 4 php -l > /dev/null
      # What ships must say what the tag says: header, version define, Stable tag.
      - name: Check the zip is the tag's version
        env:
          TAG_NAME: ${{ needs.release-please.outputs.lyrics_tag }}
        run: node .github/scripts/release-check.js zip "$TAG_NAME" build/riff-lyrics.zip
      # A host can check this zip came from this workflow, at this commit, before installing it:
      # gh attestation verify riff-lyrics.zip --repo RiffPress/RiffPress (docs/verify.md).
      - name: Attest the zip's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/riff-lyrics.zip
      - name: Attach the zip and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.lyrics_tag }}
        run: |
          set -euo pipefail
          gh release upload --clobber "$TAG_NAME" build/riff-lyrics.zip
          bash .github/scripts/publish-release.sh "$TAG_NAME" plugins/riff-lyrics/riff-lyrics.php not-latest

  # Riff Chords' release: its own zip on its own GitHub release, built the way
  # Riff's is. It is never marked the latest release; that stays Riff's.
  release-riff-chords:
    needs: release-please
    if: ${{ needs.release-please.outputs.chords_release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      # attest-build-provenance signs with the workflow's identity and stores the attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tagged commit, not the run's: a scheduled or manual run releases what an
          # earlier merge tagged, and the zip must rebuild from the tag (docs/verify.md).
          ref: ${{ needs.release-please.outputs.chords_tag }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          coverage: none
      - name: Build riff-chords.zip
        run: |
          set -euo pipefail
          bash .github/scripts/build-zip.sh riff-chords
      - name: Smoke-test the build
        run: |
          set -euo pipefail
          test -f build/riff-chords/riff-chords.php
          find build/riff-chords -name '*.php' -print0 | xargs -0 -n1 -P 4 php -l > /dev/null
      # What ships must say what the tag says: header, version define, Stable tag.
      - name: Check the zip is the tag's version
        env:
          TAG_NAME: ${{ needs.release-please.outputs.chords_tag }}
        run: node .github/scripts/release-check.js zip "$TAG_NAME" build/riff-chords.zip
      # A host can check this zip came from this workflow, at this commit, before installing it:
      # gh attestation verify riff-chords.zip --repo RiffPress/RiffPress (docs/verify.md).
      - name: Attest the zip's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/riff-chords.zip
      - name: Attach the zip and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.chords_tag }}
        run: |
          set -euo pipefail
          gh release upload --clobber "$TAG_NAME" build/riff-chords.zip
          bash .github/scripts/publish-release.sh "$TAG_NAME" plugins/riff-chords/riff-chords.php not-latest

  # Riff Sign In's release: its own zip on its own GitHub release, built the way
  # Riff's is. It is never marked the latest release; that stays Riff's.
  release-riff-sign-in:
    needs: release-please
    if: ${{ needs.release-please.outputs.sign_in_release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      # attest-build-provenance signs with the workflow's identity and stores the attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tagged commit, not the run's: a scheduled or manual run releases what an
          # earlier merge tagged, and the zip must rebuild from the tag (docs/verify.md).
          ref: ${{ needs.release-please.outputs.sign_in_tag }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          coverage: none
      - name: Build riff-sign-in.zip
        run: |
          set -euo pipefail
          bash .github/scripts/build-zip.sh riff-sign-in
      - name: Smoke-test the build
        run: |
          set -euo pipefail
          test -f build/riff-sign-in/riff-sign-in.php
          find build/riff-sign-in -name '*.php' -print0 | xargs -0 -n1 -P 4 php -l > /dev/null
      # What ships must say what the tag says: header, version define, Stable tag.
      - name: Check the zip is the tag's version
        env:
          TAG_NAME: ${{ needs.release-please.outputs.sign_in_tag }}
        run: node .github/scripts/release-check.js zip "$TAG_NAME" build/riff-sign-in.zip
      # A host can check this zip came from this workflow, at this commit, before installing it:
      # gh attestation verify riff-sign-in.zip --repo RiffPress/RiffPress (docs/verify.md).
      - name: Attest the zip's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/riff-sign-in.zip
      - name: Attach the zip and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.sign_in_tag }}
        run: |
          set -euo pipefail
          gh release upload --clobber "$TAG_NAME" build/riff-sign-in.zip
          bash .github/scripts/publish-release.sh "$TAG_NAME" plugins/riff-sign-in/riff-sign-in.php not-latest

  # Riff Sing's release: its own zip on its own GitHub release, built the way
  # Riff's is. It is never marked the latest release; that stays Riff's.
  release-riff-sing:
    needs: release-please
    if: ${{ needs.release-please.outputs.sing_release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      # attest-build-provenance signs with the workflow's identity and stores the attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tagged commit, not the run's: a scheduled or manual run releases what an
          # earlier merge tagged, and the zip must rebuild from the tag (docs/verify.md).
          ref: ${{ needs.release-please.outputs.sing_tag }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          coverage: none
      - name: Build riff-sing.zip
        run: |
          set -euo pipefail
          bash .github/scripts/build-zip.sh riff-sing
      - name: Smoke-test the build
        run: |
          set -euo pipefail
          test -f build/riff-sing/riff-sing.php
          find build/riff-sing -name '*.php' -print0 | xargs -0 -n1 -P 4 php -l > /dev/null
      # What ships must say what the tag says: header, version define, Stable tag.
      - name: Check the zip is the tag's version
        env:
          TAG_NAME: ${{ needs.release-please.outputs.sing_tag }}
        run: node .github/scripts/release-check.js zip "$TAG_NAME" build/riff-sing.zip
      # A host can check this zip came from this workflow, at this commit, before installing it:
      # gh attestation verify riff-sing.zip --repo RiffPress/RiffPress (docs/verify.md).
      - name: Attest the zip's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/riff-sing.zip
      - name: Attach the zip and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.sing_tag }}
        run: |
          set -euo pipefail
          gh release upload --clobber "$TAG_NAME" build/riff-sing.zip
          bash .github/scripts/publish-release.sh "$TAG_NAME" plugins/riff-sing/riff-sing.php not-latest

  release-riff-chimera:
    needs: release-please
    if: ${{ needs.release-please.outputs.chimera_release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      # attest-build-provenance signs with the workflow's identity and stores the attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tagged commit, not the run's: a scheduled or manual run releases what an
          # earlier merge tagged, and the zip must rebuild from the tag (docs/verify.md).
          ref: ${{ needs.release-please.outputs.chimera_tag }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          coverage: none
      - name: Build riff-chimera.zip
        run: |
          set -euo pipefail
          bash .github/scripts/build-zip.sh riff-chimera
      - name: Smoke-test the build
        run: |
          set -euo pipefail
          test -f build/riff-chimera/riff-chimera.php
          find build/riff-chimera -name '*.php' -print0 | xargs -0 -n1 -P 4 php -l > /dev/null
      # What ships must say what the tag says: header, version define, Stable tag.
      - name: Check the zip is the tag's version
        env:
          TAG_NAME: ${{ needs.release-please.outputs.chimera_tag }}
        run: node .github/scripts/release-check.js zip "$TAG_NAME" build/riff-chimera.zip
      # A host can check this zip came from this workflow, at this commit, before installing it:
      # gh attestation verify riff-chimera.zip --repo RiffPress/RiffPress (docs/verify.md).
      - name: Attest the zip's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/riff-chimera.zip
      - name: Attach the zip and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.chimera_tag }}
        run: |
          set -euo pipefail
          gh release upload --clobber "$TAG_NAME" build/riff-chimera.zip
          bash .github/scripts/publish-release.sh "$TAG_NAME" plugins/riff-chimera/riff-chimera.php not-latest

  # wp-api-coverage's release: the GitHub release is published, and the
  # package goes to npm as @riffpress/wp-api-coverage. Publishing stays off
  # until the repository variable NPM_PUBLISH is "true", which is set once the
  # @riffpress scope exists on npm and the NPM_TOKEN secret is stored.
  release-wp-api-coverage:
    needs: release-please
    if: ${{ needs.release-please.outputs.coverage_release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      # npm provenance signs the package with the workflow's identity.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Test the package
        run: npm test --prefix packages/wp-api-coverage
      - name: Publish to npm
        if: ${{ vars.NPM_PUBLISH == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public ./packages/wp-api-coverage
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.coverage_tag }}
        run: gh release edit "$TAG_NAME" --draft=false --latest=false

  # After a Riff or Riff Sign In release is published, start a workflow in
  # another repository, so whatever pins those releases (Riff Cloud pins those
  # two) can move to them now instead of waiting for its own schedule. Nothing
  # here names who that is: the repository variables DOWNSTREAM_REPO
  # (owner/name) and DOWNSTREAM_WORKFLOW (the workflow's file name, which must
  # accept workflow_dispatch) say, and it runs with the DOWNSTREAM_DISPATCH_TOKEN
  # secret: a fine-grained personal access token scoped to that one repository
  # with Actions read and write, and nothing else.
  #
  # The release jobs publish their release as their last step, so this runs
  # once the release and its zip are out, and once when both release in one
  # run. A missing variable or token, or a dispatch that fails three times,
  # fails this job, so the run goes red and report-failure says so, but the
  # releases are already published and stay so; the downstream also polls.
  notify-downstream:
    needs: [release-please, build-release-asset, release-riff-sign-in]
    if: ${{ always() && (needs.build-release-asset.result == 'success' || needs.release-riff-sign-in.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Start the downstream workflow
        env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_TOKEN }}
          REPO: ${{ vars.DOWNSTREAM_REPO }}
          WORKFLOW: ${{ vars.DOWNSTREAM_WORKFLOW }}
        run: |
          set -euo pipefail
          if [[ -z "$REPO" || -z "$WORKFLOW" || -z "$GH_TOKEN" ]]; then
            echo "::error::The release is published, but nothing downstream was told: DOWNSTREAM_REPO, DOWNSTREAM_WORKFLOW or the DOWNSTREAM_DISPATCH_TOKEN secret is not set (docs/ecosystem.md)."
            exit 1
          fi
          for attempt in 1 2 3; do
            if gh workflow run "$WORKFLOW" --repo "$REPO"; then
              echo "Started $WORKFLOW in $REPO."
              exit 0
            fi
            sleep $(( attempt * 15 ))
          done
          echo "::error::The release is published, but starting $WORKFLOW in $REPO failed three times. The token may have expired or lost Actions write."
          exit 1

  # Every package's release ends published with its zip, or this fails. It
  # reads all the releases, not just this run's, because a release job that
  # failed half way leaves a tag and a draft that release-please never comes
  # back to; until someone finishes it, every run says so.
  verify-releases:
    needs: [release-please, build-release-asset, release-riff-lyrics, release-riff-chords, release-riff-sign-in, release-riff-sing, release-riff-chimera, release-wp-api-coverage]
    if: ${{ always() && needs.release-please.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Draft releases are listed only to a token that may push.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every package's release is published with its zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node .github/scripts/release-check.js releases

  # A failure anywhere above opens one issue, "The release train stopped", with
  # this run and each job's result; while it is open, later failures only show
  # as red runs. Success says nothing.
  report-failure:
    needs: [release-please, sync-versions, build-release-asset, deploy-wordpress-org, release-riff-lyrics, release-riff-chords, release-riff-sign-in, release-riff-sing, release-riff-chimera, release-wp-api-coverage, notify-downstream, verify-releases]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/body.md"
          {
            echo "The release workflow failed in [this run]($RUN_URL)."
            echo
            echo '| Job | Result |'
            echo '| --- | --- |'
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<< "$RESULTS"
            echo
            cat <<'EOF'
          A failed `release-*` or `build-release-asset` job leaves its tag and a draft release: rebuild and attach the zip from the tag, then publish it with `.github/scripts/publish-release.sh`, or re-run the failed jobs if the tag still matches. A failed `notify-downstream` means every release is published and only the downstream was not told. A failed `verify-releases` names each unfinished release in its log. See "When the release train stops" in docs/ecosystem.md.
          EOF
          } > "$body"
          bash .github/scripts/release-alarm.sh "$body"
