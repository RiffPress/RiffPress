          test -f build/riff-chords/riff-chords.php
          find build/riff-chords -name '*.php' -print0 | xargs -0 -n1 -P 4 php -l > /dev/null
      # A host can check this zip came from this workflow, at this commit, before installing it:
      # gh attestation verify riff-chords.zip --repo RiffPress/RiffPress (docs/verify.md).
      - name: Attest the zip's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/riff-chords.zip
      - name: Attach the zip and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.chords_tag }}
        run: |
          set -euo pipefail
          gh release upload --clobber "$TAG_NAME" build/riff-chords.zip
          bash .github/scripts/publish-release.sh "$TAG_NAME" plugins/riff-chords/riff-chords.php not-latest

  # Riff Sign In's release: its own zip on its own GitHub release, built the way
  # Riff's is. It is never marked the latest release; that stays Riff's.
  release-riff-sign-in:
    needs: release-please
    if: ${{ needs.release-please.outputs.sign_in_release }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # attest-build-provenance signs with the workflow's identity and stores the attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tagged commit, not the run's: a scheduled or manual run releases what an
          # earlier merge tagged, and the zip must rebuild from the tag (docs/verify.md).
          ref: ${{ needs.release-please.outputs.sign_in_tag }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          coverage: none
      - name: Build riff-sign-in.zip
        run: |
          set -euo pipefail
          bash .github/scripts/build-zip.sh riff-sign-in
      - name: Smoke-test the build
        run: |
          set -euo pipefail
          test -f build/riff-sign-in/riff-sign-in.php
          find build/riff-sign-in -name '*.php' -print0 | xargs -0 -n1 -P 4 php -l > /dev/null
      # A host can check this zip came from this workflow, at this commit, before installing it:
      # gh attestation verify riff-sign-in.zip --repo RiffPress/RiffPress (docs/verify.md).
      - name: Attest the zip's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/riff-sign-in.zip
      - name: Attach the zip and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.sign_in_tag }}
        run: |
          set -euo pipefail
          gh release upload --clobber "$TAG_NAME" build/riff-sign-in.zip
          bash .github/scripts/publish-release.sh "$TAG_NAME" plugins/riff-sign-in/riff-sign-in.php not-latest

  # Riff Sing's release: its own zip on its own GitHub release, built the way
  # Riff's is. It is never marked the latest release; that stays Riff's.
  release-riff-sing:
    needs: release-please
    if: ${{ needs.release-please.outputs.sing_release }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # attest-build-provenance signs with the workflow's identity and stores the attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tagged commit, not the run's: a scheduled or manual run releases what an
          # earlier merge tagged, and the zip must rebuild from the tag (docs/verify.md).
          ref: ${{ needs.release-please.outputs.sing_tag }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          coverage: none
      - name: Build riff-sing.zip
        run: |
          set -euo pipefail
          bash .github/scripts/build-zip.sh riff-sing
      - name: Smoke-test the build
        run: |
          set -euo pipefail
          test -f build/riff-sing/riff-sing.php
          find build/riff-sing -name '*.php' -print0 | xargs -0 -n1 -P 4 php -l > /dev/null
      # A host can check this zip came from this workflow, at this commit, before installing it:
      # gh attestation verify riff-sing.zip --repo RiffPress/RiffPress (docs/verify.md).
      - name: Attest the zip's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/riff-sing.zip
      - name: Attach the zip and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.sing_tag }}
        run: |
          set -euo pipefail
          gh release upload --clobber "$TAG_NAME" build/riff-sing.zip
          bash .github/scripts/publish-release.sh "$TAG_NAME" plugins/riff-sing/riff-sing.php not-latest

  release-riff-meters:
    needs: release-please
    if: ${{ needs.release-please.outputs.meters_release }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # attest-build-provenance signs with the workflow's identity and stores the attestation.
      id-token: write
