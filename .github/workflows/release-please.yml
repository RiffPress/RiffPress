          test -f build/riff-meters/riff-meters.php
          find build/riff-meters -name '*.php' -print0 | xargs -0 -n1 -P 4 php -l > /dev/null
      # A host can check this zip came from this workflow, at this commit, before installing it:
      # gh attestation verify riff-meters.zip --repo RiffPress/RiffPress (docs/verify.md).
      - name: Attest the zip's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/riff-meters.zip
      - name: Attach the zip and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.meters_tag }}
        run: |
          set -euo pipefail
          gh release upload --clobber "$TAG_NAME" build/riff-meters.zip
          bash .github/scripts/publish-release.sh "$TAG_NAME" plugins/riff-meters/riff-meters.php not-latest

  # wp-api-coverage's release: the GitHub release is published, and the
  # package goes to npm as @riffpress/wp-api-coverage. Publishing stays off
  # until the repository variable NPM_PUBLISH is "true", which is set once the
  # @riffpress scope exists on npm and the NPM_TOKEN secret is stored.
  release-wp-api-coverage:
    needs: release-please
    if: ${{ needs.release-please.outputs.coverage_release }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # npm provenance signs the package with the workflow's identity.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Test the package
        run: npm test --prefix packages/wp-api-coverage
      - name: Publish to npm
        if: ${{ vars.NPM_PUBLISH == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public ./packages/wp-api-coverage
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.coverage_tag }}
        run: gh release edit "$TAG_NAME" --draft=false --latest=false
