      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          coverage: none
      - name: Build riff-lyrics.zip
        run: |
          set -euo pipefail
          bash .github/scripts/build-zip.sh riff-lyrics
      - name: Smoke-test the build
        run: |
          set -euo pipefail
          test -f build/riff-lyrics/riff-lyrics.php
          find build/riff-lyrics -name '*.php' -print0 | xargs -0 -n1 -P 4 php -l > /dev/null
      # A host can check this zip came from this workflow, at this commit, before installing it:
      # gh attestation verify riff-lyrics.zip --repo RiffPress/RiffPress (docs/verify.md).
      - name: Attest the zip's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/riff-lyrics.zip
      - name: Attach the zip and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.lyrics_tag }}
        run: |
          set -euo pipefail
          gh release upload --clobber "$TAG_NAME" build/riff-lyrics.zip
          bash .github/scripts/publish-release.sh "$TAG_NAME" plugins/riff-lyrics/riff-lyrics.php not-latest

  # Riff Chords' release: its own zip on its own GitHub release, built the way
  # Riff's is. It is never marked the latest release; that stays Riff's.
  release-riff-chords:
    needs: release-please
    if: ${{ needs.release-please.outputs.chords_release }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # attest-build-provenance signs with the workflow's identity and stores the attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tagged commit, not the run's: a scheduled or manual run releases what an
          # earlier merge tagged, and the zip must rebuild from the tag (docs/verify.md).
          ref: ${{ needs.release-please.outputs.chords_tag }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
