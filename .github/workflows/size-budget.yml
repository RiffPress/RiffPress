name: Size budget

# Builds a 5,000-track catalogue on a fresh wp-env (MySQL) and measures Riff's routes against
# packages/benchmarks/budget.json: the query count each request may make and a time ceiling. A
# change that makes the library cost more per request than the budget fails here (#368). The
# messy library is built beside it, and the layout checks run over every view that shows it, for
# long titles, missing covers and names in every script (#446).
on:
  pull_request:
    # A draft waits, as CI's wp-env jobs do; marking it ready runs it.
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths:
      - 'plugins/riff/src/**'
      - 'plugins/riff/features/**'
      - 'packages/benchmarks/**'
      - '.github/scripts/size-budget.js'
      - '.github/workflows/size-budget.yml'
  schedule:
    - cron: '7 6 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  budget:
    name: 5,000 tracks on MySQL
    if: ${{ ! github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version-file: .php-version
          coverage: none
          tools: composer
      - run: composer install --no-dev --no-interaction --prefer-dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-
      # A runner that can reach none of Ubuntu's mirrors is given one it can (apt-mirror.sh).
      - run: bash .github/scripts/apt-mirror.sh
      - run: npx playwright install-deps chromium
      - run: npx playwright install chromium
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}

      - run: npm run env:start

      - name: Build the catalogue
        run: npx wp-env run tests-cli wp eval-file wp-content/riff/packages/benchmarks/catalog.php build

      # SAVEQUERIES has to be on before WordPress loads to count queries.
      - name: Measure
        run: |
          set -euo pipefail
          npx wp-env run tests-cli wp --exec="define( 'SAVEQUERIES', true );" eval-file wp-content/riff/packages/benchmarks/catalog.php measure | sed -n '/^{/,$p' > measured.json
          cat measured.json

      - name: Check against the budget
        run: |
          set -euo pipefail
          node .github/scripts/size-budget.js measured.json | tee -a "$GITHUB_STEP_SUMMARY"

      # The messy library comes after the measure: its posts hold their tracks as blocks, which
      # the library route reads track by track, so measuring with it there counts the fixture's
      # cost, not the plugin's.
      - name: Build the messy library
        run: npx wp-env run tests-cli wp eval-file wp-content/riff/packages/benchmarks/catalog.php build messy

      - name: Every view of the messy library is tidy
        run: npm run test:e2e -- plugins/riff/tests/e2e/app/messy.spec.js --project=chromium

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: messy-e2e-artifacts
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
