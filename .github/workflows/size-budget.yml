name: Size budget

# Builds a 5,000-track catalogue on a fresh wp-env (MySQL) and measures Riff's routes against
# packages/benchmarks/budget.json: the query count each request may make and a time ceiling. A
# change that makes the library cost more per request than the budget fails here (#368).
on:
  pull_request:
    paths:
      - 'plugins/riff/src/**'
      - 'plugins/riff/features/**'
      - 'packages/benchmarks/**'
      - '.github/scripts/size-budget.js'
      - '.github/workflows/size-budget.yml'
  schedule:
    - cron: '7 6 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  budget:
    name: 5,000 tracks on MySQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      - run: composer install --no-dev --no-interaction --prefer-dist
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run env:start

      - name: Build the catalogue
        run: npx wp-env run tests-cli wp eval-file wp-content/riff/packages/benchmarks/catalog.php build

      # SAVEQUERIES has to be on before WordPress loads to count queries.
      - name: Measure
        run: |
          set -euo pipefail
          npx wp-env run tests-cli wp --exec="define( 'SAVEQUERIES', true );" eval-file wp-content/riff/packages/benchmarks/catalog.php measure | sed -n '/^{/,$p' > measured.json
          cat measured.json

      - name: Check against the budget
        run: |
          set -euo pipefail
          node .github/scripts/size-budget.js measured.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stop the testing environment
        if: ${{ always() }}
        run: npx wp-env stop || true
