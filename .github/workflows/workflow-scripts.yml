name: Workflow Scripts Tests

# The tests read across the repository: every plugin's header, isolation.json, assets and source,
# the generated types, the docs, the site's pages, the workflows and the demo fixtures. A list of
# paths fell behind what they read, so a change that broke them merged without running them (#1045).
# They take seconds, so they run on every push to main and every pull request, and by hand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  test:
    name: Run script unit tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # site/web is built, not committed, as the Pages deploy builds it; the tests read its pages.
      - name: Build site/web
        run: node .github/scripts/web-pages.js

      - name: Run tests
        run: node --test .github/scripts/*.test.js
