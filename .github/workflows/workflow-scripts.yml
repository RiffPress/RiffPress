name: Workflow Scripts Tests

# demo-blueprint.test.js reads the blueprint, the landing page, the workflows, the demo fixtures, and
# the files that carry the landing page's address, so a change to any of them runs it too.
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/**'
      - 'blueprint.json'
      - 'site/index.html'
      - 'packages/fixtures/**'
      - 'README.md'
      - 'plugins/riff/riff.php'
      - 'composer.json'
      - 'package.json'
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/**'
      - 'blueprint.json'
      - 'site/index.html'
      - 'packages/fixtures/**'
      - 'README.md'
      - 'plugins/riff/riff.php'
      - 'composer.json'
      - 'package.json'

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  test:
    name: Run script unit tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run tests
        run: node --test .github/scripts/*.test.js
      - name: The hooks reference is current
        run: node .github/scripts/hooks-reference.js --check
